name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime-lab:
    name: Runtime Lab
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run repository checks
        run: make check
