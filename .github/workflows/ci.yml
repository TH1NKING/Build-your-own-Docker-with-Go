name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  postgres-migrations:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: migration-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AGENT_TEST_DATABASE_URL: postgres://postgres:migration-test-password@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify migrations through agentctl against real PostgreSQL
        run: make test-migrations

      - name: Verify Worker credentials, leases, and immutable reports
        run: make test-worker-api

  runtime-lab:
    name: Runtime Lab
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run repository checks
        run: make check

  profile-bundle:
    name: Profile Bundle
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: worker-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AGENT_TEST_DATABASE_URL: postgres://postgres:worker-test-password@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download locked Runtime Profile inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/prepare-profile-sources.py --cache "$RUNNER_TEMP/profile-sources"
          python3 tests/prepare-profile-sources.py --cache "$RUNNER_TEMP/profile-sources" --check

      - name: Build Profile Bundle test commands
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/profile-bundle" ./cmd/profile-bundle
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags=-buildid= \
            -o "$RUNNER_TEMP/sandbox-init" ./cmd/sandbox-init
          go test -c \
            -tags='profilebundle_root profilebundle_production' \
            -o "$RUNNER_TEMP/profile-bundle-tests" \
            ./tests

      - name: Verify Profile Bundle on Linux as root
        shell: bash
        run: |
          set -euo pipefail
          sudo -n unshare --net env \
            PROFILE_BUNDLE_CLI="$RUNNER_TEMP/profile-bundle" \
            PROFILE_BUNDLE_REPOSITORY_ROOT="$GITHUB_WORKSPACE" \
            PROFILE_BUNDLE_SOURCE_CACHE="$RUNNER_TEMP/profile-sources" \
            PROFILE_BUNDLE_SANDBOX_INIT="$RUNNER_TEMP/sandbox-init" \
            "$RUNNER_TEMP/profile-bundle-tests" \
            -test.v \
            -test.run='^(TestProfileBundleInstall|TestPythonDataV1Production)'

      - name: Verify T15 Sandbox security acceptance with no skipped tests
        shell: bash
        run: |
          PROFILE_BUNDLE_SOURCE_CACHE="$RUNNER_TEMP/profile-sources" \
            SANDBOX_ACCEPTANCE_LOG_DIR="$RUNNER_TEMP/sandbox-acceptance" \
            bash tests/run-sandbox-acceptance-linux.sh

      - name: Verify Runtime Lab exit status, OverlayFS and isolated bridge demo
        shell: bash
        run: |
          PROFILE_BUNDLE_SOURCE_CACHE="$RUNNER_TEMP/profile-sources" \
            bash tests/run-runtime-lab-demo-linux.sh

      - name: Retain Sandbox acceptance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-security-acceptance
          path: ${{ runner.temp }}/sandbox-acceptance
          if-no-files-found: ignore

      - name: Verify authenticated Worker through the real Sandbox Supervisor
        shell: bash
        run: |
          PROFILE_BUNDLE_SOURCE_CACHE="$RUNNER_TEMP/profile-sources" \
            WORKER_ACCEPTANCE_LOG_DIR="$RUNNER_TEMP/worker-acceptance" \
            make test-worker-execution

      - name: Retain Worker acceptance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-execution-acceptance
          path: ${{ runner.temp }}/worker-acceptance
          if-no-files-found: ignore

  sandbox-creation:
    name: Sandbox creation (real Linux kernel)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify Sandbox identity and root isolation
        run: bash tests/run-sandbox-creation-linux.sh
